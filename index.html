<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Artillery</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Artillery</h1>
  <div class="hud">
    <div class="hp-row">
      <div class="hp-label">You</div>
      <div class="hp-bar"><div id="playerHP" class="hp-fill player"></div></div>
      <div id="playerHPText" class="hp-text"></div>
    </div>
    <div class="hp-row">
      <div class="hp-label">CPU</div>
      <div class="hp-bar"><div id="cpuHP" class="hp-fill cpu"></div></div>
      <div id="cpuHPText" class="hp-text"></div>
    </div>
    <div id="turnIndicator" class="turn">Your turn</div>
  </div>

  <canvas id="game"></canvas>

  <div class="controls">
    <div class="hint">← / → angle &nbsp; ↑ / ↓ velocity &nbsp; Space fires</div>
    <button id="fireBtn">Fire</button>
    <span class="sep"></span>
    <label>
      Difficulty:
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="newGameBtn">New game</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
